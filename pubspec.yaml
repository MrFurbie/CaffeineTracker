name: caffeine_tracker_flutter
description: A Flutter app to track caffeine intake with predefined drinks and analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Date/Time
  intl: ^0.18.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # Barcode Scanning
  mobile_scanner: ^5.0.0
  
  # HTTP Requests
  http: ^1.2.0
  
  # Permissions
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/predefined_drinks.json